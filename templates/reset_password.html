{% extends "base.html" %}
{% block title %}MercAPP — Definir Nueva Contraseña{% endblock %}

{% block content %}
<div style="min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: 20px;">
    <div style="width: 100%; max-width: 400px; background: var(--bg-card); padding: 36px; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); border: 1px solid var(--border);">
        <div style="text-align: center; margin-bottom: 30px;">
            <h1 style="font-size: 2rem; margin-bottom: 10px; color: var(--success);">Nueva Contraseña</h1>
            <p style="color: var(--text-muted);">Crea una contraseña segura para tu cuenta.</p>
        </div>

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 8px; font-weight: 600;">Nueva Contraseña</label>
                <input type="password" name="password" class="form-control" placeholder="Mínimo 6 caracteres" required minlength="6" autofocus style="width: 100%; font-size: 1.1rem;">
            </div>

            <div style="margin-bottom: 24px;">
                <label style="display: block; margin-bottom: 8px; font-weight: 600;">Confirmar Contraseña</label>
                <input type="password" name="confirm_password" class="form-control" placeholder="Repite la contraseña" required minlength="6" style="width: 100%; font-size: 1.1rem;">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px; font-weight: 700; font-size: 1.1rem;">
                Actualizar Contraseña
            </button>
        </form>
    </div>
</div>
{% endblock %}
