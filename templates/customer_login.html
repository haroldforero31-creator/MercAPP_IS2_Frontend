<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cliente - Iniciar Sesión</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        body {
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: var(--font);
            color: var(--text);
        }
        .login-card {
            background: var(--bg-card);
            padding: 40px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-card h2 {
            margin-bottom: 10px;
            color: var(--text);
            font-weight: 600;
        }
        .login-card p {
            color: var(--text-secondary);
            margin-bottom: 25px;
        }
        .form-control {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background-color: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            box-sizing: border-box;
            outline: none;
            transition: var(--transition);
        }
        .form-control:focus {
            border-color: var(--primary);
            box-shadow: var(--shadow-glow);
        }
        .btn {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: var(--transition);
        }
        .btn:hover {
            background-color: var(--primary-light);
        }
        .flash-messages {
            color: var(--error);
            margin-bottom: 15px;
            font-size: 0.95rem;
        }
        .link {
            display: block;
            margin-top: 15px;
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
        }
        .link:hover {
            color: var(--primary-light);
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Portal de Clientes</h2>
        <p>Inicia sesión para hacer tus pedidos</p>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-messages">
                    {% for category, message in messages %}
                        <div>{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="email" name="email" class="form-control" placeholder="Correo Electrónico" required>
            <input type="password" name="password" class="form-control" placeholder="Contraseña" required>
            <button type="submit" class="btn">Ingresar</button>
        </form>
        
        <a href="{{ url_for('customer_register') }}" class="link">¿No tienes cuenta? Regístrate aquí</a>
        <a href="{{ url_for('login') }}" class="link" style="color: #6b7280; font-size: 14px;">Volver al inicio</a>
    </div>
</body>
</html>
