<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MercAPP - Selecciona tu tienda</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        body {
            background-color: var(--bg);
            margin: 0;
            font-family: var(--font);
            color: var(--text);
        }
        .header {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            color: var(--text);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        .store-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 2rem;
        }
        .store-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 24px;
            text-align: center;
            box-shadow: var(--shadow);
            text-decoration: none;
            color: var(--text);
            transition: var(--transition);
            border: 1px solid var(--border);
        }
        .store-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-glow);
            border-color: var(--primary);
        }
        .store-icon {
            font-size: 40px;
            margin-bottom: 15px;
            color: var(--primary);
        }
        .store-name {
            font-size: 20px;
            font-weight: 600;
        }
        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            margin-left: 20px;
            font-weight: 500;
            transition: var(--transition);
        }
        .nav-links a:hover {
            color: var(--text);
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="header">
        <div style="font-size: 1.5rem; font-weight: bold; display: flex; align-items: center; gap: 10px;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#43A047" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
            MercAPP
        </div>
        <div class="nav-links">
            <span>Hola, {{ current_user.name }}</span>
            <a href="{{ url_for('customer_orders') }}">Mis Pedidos</a>
            <a href="{{ url_for('customer_logout') }}">Salir</a>
        </div>
    </div>

    <div class="container">
        <h1 style="font-size: 2.5rem; color: var(--text);">Tiendas Disponibles</h1>
        <p style="color: var(--text-secondary); font-size: 1.1rem;">Selecciona una tienda para empezar a comprar.</p>
        
        <div class="store-grid">
            {% for store in stores %}
            <a href="{{ url_for('customer_store', store_id=store.id) }}" class="store-card">
                <div class="store-icon">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                </div>
                <div class="store-name">{{ store.name }}</div>
            </a>
            {% else %}
            <div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: #6b7280; font-size: 1.2rem;">
                No hay tiendas registradas en este momento.
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
