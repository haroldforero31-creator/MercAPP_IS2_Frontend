{% extends "base.html" %}
{% block title %}MercAPP — Recuperar Contraseña{% endblock %}

{% block content %}
<div style="min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: 20px;">
    <div style="width: 100%; max-width: 400px; background: var(--bg-card); padding: 36px; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); border: 1px solid var(--border);">
        <div style="text-align: center; margin-bottom: 30px;">
            <h1 style="font-size: 2rem; margin-bottom: 10px; color: var(--primary);">Recuperar Acceso</h1>
            <p style="color: var(--text-muted);">Ingresa tu correo para recibir un enlace de recuperación.</p>
        </div>

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div style="margin-bottom: 24px;">
                <label style="display: block; margin-bottom: 8px; font-weight: 600;">Correo Electrónico</label>
                <input type="email" name="email" class="form-control" placeholder="ejemplo@correo.com" required style="width: 100%; font-size: 1rem;">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px; font-weight: 700; font-size: 1.1rem; margin-bottom: 20px;">
                Enviar Enlace
            </button>

            <div style="text-align: center;">
                <a href="{{ url_for('login') }}" style="color: var(--text-muted); text-decoration: none; font-size: 0.9rem;">
                    Volver al Inicio de Sesión
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
